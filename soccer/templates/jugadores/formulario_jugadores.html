{% extends 'base.html' %}

{% block title %}Registrar Jugador{% endblock %}

{% block content %}
<div class="container mt-4">

    <span class="badge rounded-pill mb-2 fs-6"
          style="background-color: #e2f0e8; color: #123d2a; padding: 10px 18px;">
        ⚽ Nuestra comunidad
    </span>

    <h1 class="fw-bold mb-1" style="color: #123d2a;">
        Registrar Jugador
    </h1>

    <p class="text-secondary mb-0">
        Regístrate.
    </p>


    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ formulario.as_p }}

        <button type="submit" class="btn btn-primary">
            Guardar
        </button>

        <a href="{% url 'listado_jugadores' %}" class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>
{% endblock %}
