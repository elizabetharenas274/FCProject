
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %} Futbol App {% endblock %}
    </title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos personalizados -->
    <style>
        body {
            background-color: #f4f7f5;
            font-family: Arial, sans-serif;
            color: #26352c;
            min-height: 100vh;
        }

        /* Barra de navegación */
        .navbar {
            background-color: #123d2a;
            padding: 15px 0;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.10);
        }

        .navbar-brand {
            color: white !important;
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .navbar-brand:hover {
            color: #b7e4c7 !important;
        }

        .navbar-nav .nav-link {
            color: #e5eee8;
            padding: 9px 17px;
            margin: 0 4px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .navbar-nav .nav-link:hover {
            background-color: #286344;
            color: white;
        }

        .navbar-nav .nav-link.active {
            background-color: #ffffff;
            color: #123d2a;
            font-weight: bold;
        }

        .navbar-toggler {
            border-color: #ffffff;
        }

        .navbar-toggler-icon {
            filter: brightness(0) invert(1);
        }

        /* Contenido principal */
        .main-container {
            background-color: white;
            min-height: 75vh;
            margin-top: 30px;
            margin-bottom: 30px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
        }

        /* Diseño adaptable */
        @media (max-width: 768px) {
            .navbar-nav {
                padding-top: 15px;
            }

            .navbar-nav .nav-link {
                margin: 4px 0;
            }

            .main-container {
                padding: 18px;
                margin-top: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Menú principal -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="#">
                ⚽ Fútbol Club
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">

                <div class="navbar-nav ms-auto">

                    <a class="nav-link"
                       href="{% url 'admin:index' %}">
                        Admin
                    </a>

                    <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                       href="{% url 'home' %}">
                        Home
                    </a>

                    <a class="nav-link {% if request.resolver_match.url_name == 'listado_jugadores' %}active{% endif %}"
                       href="{% url 'listado_jugadores' %}">
                        Jugadores
                    </a>

                    <a class="nav-link {% if request.resolver_match.url_name == 'listado_equipos' %}active{% endif %}"
                       href="{% url 'listado_equipos' %}">
                        Equipos
                    </a>

                </div>
            </div>

        </div>
    </nav>

    <!-- Contenido de cada página -->
    <div class="container main-container">

        {% block content %}
        {% endblock %}

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
